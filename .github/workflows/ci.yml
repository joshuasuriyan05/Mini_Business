name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_business_app_test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Show prisma.js
        run: cat src/lib/prisma.js

      - name: Show schema.prisma
        run: cat prisma/schema.prisma

      - name: Search for generated/prisma references
        run: grep -R "generated/prisma" . || true

      - name: Verify Prisma Client
        run: ls -la node_modules/@prisma/client

      - name: Run Unit Tests
        run: npm run test:unit

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_business_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mini_business_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_business_app_test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Show prisma.js
        run: cat src/lib/prisma.js

      - name: Show schema.prisma
        run: cat prisma/schema.prisma

      - name: Search for generated/prisma references
        run: grep -R "generated/prisma" . || true

      - name: Verify Prisma Client
        run: ls -la node_modules/@prisma/client

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy

      - name: Run Integration Tests
        run: npm run test:integration

  frontend-checks:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test -- --run || true

      - name: Build Frontend
        run: npm run build